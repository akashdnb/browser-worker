name: Utils Command Worker
run-name: Utils worker ${{ inputs.worker_id }} — ${{ inputs.worker_name }}

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: Utils worker identifier
        required: true
        type: string
      worker_name:
        description: Display name
        required: true
        type: string
      server_url:
        description: Utils server base URL
        required: true
        type: string

concurrency:
  group: utils-command-worker-${{ inputs.worker_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  worker:
    name: Personal command worker
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out worker host repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start command worker agent
        env:
          UTILS_WORKER_ID: ${{ inputs.worker_id }}
          UTILS_WORKER_NAME: ${{ inputs.worker_name }}
          UTILS_WORKER_SERVER_URL: ${{ inputs.server_url }}
          UTILS_WORKER_TOKEN: ${{ secrets.UTILS_GITHUB_WORKER_TOKEN }}
        run: |
          test -n "$UTILS_WORKER_TOKEN" || (echo "::error::Set UTILS_GITHUB_WORKER_TOKEN in repository secrets" && exit 1)
          python -m pip install --disable-pip-version-check "websockets>=14.2,<16"
          python src/utils-command-worker.py
