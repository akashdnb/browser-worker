name: Utils Command Worker
run-name: Utils worker ${{ inputs.worker_id }} — ${{ inputs.worker_name }} [${{ inputs.lifetime_hours }}h:${{ join(fromJSON(inputs.profiles), '+') }}]

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: Utils worker identifier
        required: true
        type: string
      worker_name:
        description: Display name
        required: true
        type: string
      server_url:
        description: Utils server base URL
        required: true
        type: string
      lifetime_hours:
        description: Requested hours (effective maximum 350 minutes)
        required: true
        type: string
      profiles:
        description: JSON array of profile IDs
        required: true
        type: string
      custom_setup:
        description: JSON custom package/setup object
        required: true
        type: string

concurrency:
  group: utils-command-worker-${{ inputs.worker_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Personal command worker
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.lifetime_hours == '1' && 60 || inputs.lifetime_hours == '2' && 120 || inputs.lifetime_hours == '3' && 180 || inputs.lifetime_hours == '4' && 240 || inputs.lifetime_hours == '5' && 300 || 350 }}
    steps:
      - name: Check out worker host repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: contains(fromJSON(inputs.profiles), 'node')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start command worker agent
        env:
          UTILS_WORKER_ID: ${{ inputs.worker_id }}
          UTILS_WORKER_NAME: ${{ inputs.worker_name }}
          UTILS_WORKER_SERVER_URL: ${{ inputs.server_url }}
          UTILS_WORKER_LIFETIME_HOURS: ${{ inputs.lifetime_hours }}
          UTILS_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
          UTILS_WORKER_PROFILES: ${{ inputs.profiles }}
          UTILS_WORKER_CUSTOM_SETUP: ${{ inputs.custom_setup }}
        run: |
          test -n "$UTILS_WORKER_TOKEN" || (echo "::error::Set UTILS_BROWSER_WORKER_TOKEN in repository secrets" && exit 1)
          python -m pip install --disable-pip-version-check "websockets>=14.2,<16"
          python src/utils-command-worker.py
