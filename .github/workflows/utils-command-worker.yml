name: Utils Command Worker
run-name: Utils worker ${{ inputs.worker_id }} — ${{ inputs.worker_name }} [${{ inputs.lifetime_hours }}h:${{ join(fromJSON(inputs.profiles), '+') }}]

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: Utils worker identifier
        required: true
        type: string
      worker_name:
        description: Display name
        required: true
        type: string
      server_url:
        description: Utils server base URL
        required: true
        type: string
      lifetime_hours:
        description: Requested hours (effective maximum 350 minutes)
        required: true
        type: string
      profiles:
        description: JSON array of profile IDs
        required: true
        type: string
      custom_setup:
        description: JSON custom package/setup object
        required: true
        type: string

concurrency:
  group: utils-command-worker-${{ inputs.worker_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Personal command worker
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.lifetime_hours == '6' && 350 || inputs.lifetime_hours * 60 }}
    steps:
      - name: Check out worker host repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: contains(fromJSON(inputs.profiles), 'node')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision environment profiles and custom tools
        env:
          PROFILES_JSON: ${{ inputs.profiles }}
          CUSTOM_SETUP_JSON: ${{ inputs.custom_setup }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          profiles = json.loads(os.environ["PROFILES_JSON"])
          setup = json.loads(os.environ["CUSTOM_SETUP_JSON"])
          allowed_profiles = {"minimal", "python", "node", "playwright-chromium", "devops"}
          allowed_setup = {"apt_packages", "pip_packages", "npm_packages", "commands"}
          if (not isinstance(profiles, list) or not profiles
                  or any(profile not in allowed_profiles for profile in profiles)
                  or not isinstance(setup, dict) or set(setup) - allowed_setup):
              raise SystemExit("Invalid environment configuration")
          apt = list(setup.get("apt_packages", []))
          if "devops" in profiles:
              apt += ["jq", "yq", "ripgrep", "shellcheck"]
          if apt:
              subprocess.run(["sudo", "apt-get", "update"], check=True, timeout=300)
              subprocess.run(["sudo", "apt-get", "install", "-y", "--no-install-recommends", *dict.fromkeys(apt)], check=True, timeout=600)
          pip = list(setup.get("pip_packages", []))
          if "playwright-chromium" in profiles:
              pip += ["playwright"]
          if pip:
              subprocess.run(["python", "-m", "pip", "install", "--disable-pip-version-check", *dict.fromkeys(pip)], check=True, timeout=600)
          if "playwright-chromium" in profiles:
              subprocess.run(["python", "-m", "playwright", "install", "--with-deps", "chromium"], check=True, timeout=900)
          npm = list(setup.get("npm_packages", []))
          if npm:
              subprocess.run(["npm", "install", "--global", *dict.fromkeys(npm)], check=True, timeout=600)
          for command in setup.get("commands", []):
              subprocess.run(command, shell=True, check=True, timeout=600)
          PY

      - name: Start command worker agent
        env:
          UTILS_WORKER_ID: ${{ inputs.worker_id }}
          UTILS_WORKER_NAME: ${{ inputs.worker_name }}
          UTILS_WORKER_SERVER_URL: ${{ inputs.server_url }}
          UTILS_WORKER_LIFETIME_HOURS: ${{ inputs.lifetime_hours }}
          UTILS_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
        run: |
          test -n "$UTILS_WORKER_TOKEN" || (echo "::error::Set UTILS_BROWSER_WORKER_TOKEN in repository secrets" && exit 1)
          python -m pip install --disable-pip-version-check "websockets>=14.2,<16"
          python src/utils-command-worker.py
