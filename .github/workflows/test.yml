name: Browser Worker Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run worker tests
        run: npm test
      - name: Run Python command worker tests
        run: |
          python -m pip install --disable-pip-version-check "websockets>=14.2,<16"
          python -m unittest discover -s test -p "test_utils_command_worker.py"
      - name: Run session agent tests
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest test/session_agent_test.py
