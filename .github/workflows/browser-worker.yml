name: Browser Worker

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Previous worker run whose browser profile must be restored"
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    concurrency:
      group: browser-worker-guard-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      should_start: ${{ steps.check.outputs.should_start }}
    steps:
      - name: Skip if an interactive worker is already running
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Explicit profile handoff from run $SOURCE_RUN_ID"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active_run_id="$(gh run list --repo "$REPO" --workflow browser-worker.yml --status in_progress --limit 50 --json databaseId --jq ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId" | head -n 1 || true)"
          if [ -n "$active_run_id" ]; then
            echo "::notice::Skipping $EVENT_NAME start: Browser Worker run $active_run_id is already active."
            echo "should_start=false" >> "$GITHUB_OUTPUT"
          else
            echo "No other Browser Worker run is active"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
          fi

  browser:
    needs: guard
    if: needs.guard.outputs.should_start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout worker configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up interactive desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc openbox xdotool

      - name: Restore previous browser profile
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          export BROWSER_WORKER_PROFILE_DIR="$GITHUB_WORKSPACE/browser-worker-state/live-profile"
          mkdir -p browser-worker-state "$BROWSER_WORKER_PROFILE_DIR"
          echo "BROWSER_WORKER_PROFILE_DIR=$BROWSER_WORKER_PROFILE_DIR" >> "$GITHUB_ENV"
          echo "BROWSER_WORKER_PROFILE_DIR=$BROWSER_WORKER_PROFILE_DIR" >> "$GITHUB_ENV"

          restore_archive() {
            local archive="$1"
            local extracted="$GITHUB_WORKSPACE/browser-worker-state/profile-restore"
            rm -rf "$extracted"
            if [ ! -s "$archive" ]; then return 1; fi
            if ! tar -tzf "$archive" | grep -Fx "browser-worker-profile/Local State" > /dev/null ||
               ! tar -tzf "$archive" | grep -Fx "browser-worker-profile/Default/Preferences" > /dev/null; then
              echo "::warning::Profile archive is missing Chromium metadata"
              return 1
            fi
            mkdir -p "$extracted"
            if ! tar -xzf "$archive" -C "$extracted"; then rm -rf "$extracted"; return 1; fi
            if [ ! -s "$extracted/browser-worker-profile/Local State" ] ||
               [ ! -s "$extracted/browser-worker-profile/Default/Preferences" ]; then
              rm -rf "$extracted"
              return 1
            fi
            local cache_backup="$extracted/browser-worker-profile/Default/Service Worker/CacheStorage.preserved"
            local cache_target="$extracted/browser-worker-profile/Default/Service Worker/CacheStorage"
            if [ -d "$cache_backup" ]; then rm -rf "$cache_target"; mv "$cache_backup" "$cache_target"; fi
            rm -rf "$BROWSER_WORKER_PROFILE_DIR"
            mv "$extracted/browser-worker-profile" "$BROWSER_WORKER_PROFILE_DIR"
            rm -rf "$extracted"
            echo "Restored Chromium profile"
            return 0
          }

          restore_run() {
            local run_id="$1"
            local artifact_dir="browser-worker-state/profile-artifact"
            rm -rf "$artifact_dir"
            if ! gh run download "$run_id" -n browser-worker-profile -D "$artifact_dir" 2>/dev/null; then return 1; fi
            restore_archive "$artifact_dir/browser-worker-profile.tar.gz" || return 1
            gh run download "$run_id" -n browser-worker-state -D browser-worker-state 2>/dev/null || true
            return 0
          }

          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Waiting for final profile artifact from worker run $SOURCE_RUN_ID"
            restored=false
            for attempt in $(seq 1 80); do
              if restore_run "$SOURCE_RUN_ID"; then restored=true; break; fi
              echo "Source profile artifact not available yet (attempt $attempt/80); waiting 15s"
              rm -rf "$BROWSER_WORKER_PROFILE_DIR"
              mkdir -p "$BROWSER_WORKER_PROFILE_DIR"
              sleep 15
            done
            if [ "$restored" != "true" ]; then
              echo "::error::Timed out waiting for the final profile artifact from run $SOURCE_RUN_ID"
              exit 1
            fi
          else
            previous_run_ids="$(gh run list --workflow browser-worker.yml --status success --limit 20 --json databaseId --jq '.[].databaseId')"
            restored=false
            while IFS= read -r previous_run_id; do
              [ -n "$previous_run_id" ] || continue
              if restore_run "$previous_run_id"; then restored=true; break; fi
            done <<< "$previous_run_ids"

            if [ "$restored" != "true" ]; then
              # A cancelled/killed worker may never publish its final profile
              # artifact. In that case, recover the latest periodic checkpoint.
              checkpoint_runs="$(gh run list --workflow browser-worker.yml --status completed --limit 30 --json databaseId --jq '.[].databaseId')"
              while IFS= read -r previous_run_id; do
                [ -n "$previous_run_id" ] || continue
                checkpoint_dir="browser-worker-state/checkpoint-artifact"
                rm -rf "$checkpoint_dir"
                if gh run download "$previous_run_id" -n browser-worker-profile-checkpoint -D "$checkpoint_dir" 2>/dev/null &&
                   restore_archive "$checkpoint_dir/browser-worker-profile.tar.gz"; then
                  restored=true
                  echo "Restored latest available periodic profile checkpoint from run $previous_run_id"
                  break
                fi
              done <<< "$checkpoint_runs"
            fi

            if [ "$restored" != "true" ]; then
              echo "::error::No valid final profile or periodic checkpoint was found. Refusing to start a blank profile."
              exit 1
            fi
          fi

      - name: Install upstream Playwright MCP
        run: npm install --no-save @playwright/mcp@0.0.83 ws@^8.18.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium executable
        run: |
          chromium_bin="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$chromium_bin"
          echo "CHROMIUM_BIN=$chromium_bin" >> "$GITHUB_ENV"
          echo "Using shared interactive Chromium at $chromium_bin"

      - name: Stop older worker runs after a push deployment
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          for run_id in $(gh run list --workflow browser-worker.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then gh run cancel "$run_id" || true; fi
          done

      - name: Run browser worker and interactive desktop
        env:
          UTILS_BROWSER_WORKER_URL: ${{ secrets.UTILS_BROWSER_WORKER_URL }}
          UTILS_BROWSER_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
          BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON: ${{ secrets.BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON }}
          BROWSER_WORKER_STATE_FILE: browser-worker-state/storage-state.json
          PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp
          PLAYWRIGHT_MCP_USER_DATA_DIR: ${{ github.workspace }}/browser-worker-state/live-profile
          BROWSER_WORKER_CHECKPOINT_DIR: ${{ github.workspace }}/browser-worker-state/live-checkpoint
          BROWSER_WORKER_CHECKPOINT_SECONDS: "60"
          PLAYWRIGHT_MCP_CDP_ENDPOINT: http://127.0.0.1:9222
          PLAYWRIGHT_MCP_CDP_TIMEOUT: "120000"
          WORKER_MAX_SECONDS: "19800"
          WORKER_RENEWAL_LEAD_SECONDS: "900"
          GITHUB_TOKEN: ${{ github.token }}
          VM_WORKER_ID: github-${{ github.run_id }}
          VM_CHROMIUM_DEBUG_PORT: "9222"
          DISPLAY: ":99"
          NODE_OPTIONS: "--import=./src/vm-heartbeat-hook.mjs"
        run: |
          test -n "$UTILS_BROWSER_WORKER_URL" || (echo "::error::Set UTILS_BROWSER_WORKER_URL in repository secrets" && exit 1)
          test -n "$UTILS_BROWSER_WORKER_TOKEN" || (echo "::error::Set UTILS_BROWSER_WORKER_TOKEN in repository secrets" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "::error::GitHub Actions token is unavailable" && exit 1)
          test -n "$CHROMIUM_BIN" || (echo "::error::Chromium executable was not found" && exit 1)

          bash src/vm-supervisor.sh > "$RUNNER_TEMP/interactive-vm.log" 2>&1 &
          vm_pid=$!
          node src/profile-checkpoint-runner.mjs &
          checkpoint_pid=$!
          trap 'kill "$vm_pid" "$checkpoint_pid" 2>/dev/null || true; wait "$vm_pid" "$checkpoint_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 300); do
            if grep -q "Interactive VM connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
              echo "Interactive VM relay is connected"
              break
            fi
            if ! kill -0 "$vm_pid" 2>/dev/null; then
              echo "::error::Interactive VM supervisor exited during startup"
              cat "$RUNNER_TEMP/interactive-vm.log"
              exit 1
            fi
            sleep 1
          done

          if ! grep -q "Interactive VM connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
            echo "::error::Interactive VM relay did not connect to utils within 5 minutes"
            cat "$RUNNER_TEMP/interactive-vm.log"
            exit 1
          fi

          node src/worker.js

      - name: Prepare browser profile artifact
        if: ${{ always() }}
        run: |
          profile_dir="$BROWSER_WORKER_PROFILE_DIR"
          if [ ! -d "$profile_dir" ] || [ ! -s "$profile_dir/Local State" ] || [ ! -s "$profile_dir/Default/Preferences" ]; then
            echo "::error::Chromium profile is missing or empty; refusing to publish a blank snapshot"
            exit 1
          fi

          node --input-type=module -e '
            import { createProfileCheckpoint } from "./src/profile-checkpoint.mjs";
            await createProfileCheckpoint({ profileDir: process.env.BROWSER_WORKER_PROFILE_DIR, outputDir: process.cwd() });
          '
          ls -lh browser-worker-profile.tar.gz

      - name: Upload browser profile
        if: ${{ always() && hashFiles('browser-worker-profile.tar.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-profile
          path: browser-worker-profile.tar.gz
          retention-days: 90
          overwrite: true

      - name: Upload latest checkpoint archive
        if: ${{ always() && hashFiles('browser-worker-state/live-checkpoint/browser-worker-profile.tar.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-profile-checkpoint
          path: browser-worker-state/live-checkpoint/browser-worker-profile.tar.gz
          retention-days: 90
          overwrite: true

      - name: Upload browser storage state
        if: ${{ always() && hashFiles('browser-worker-state/storage-state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-state
          path: browser-worker-state/storage-state.json
          retention-days: 90
          overwrite: true
