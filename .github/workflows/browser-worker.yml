name: Browser Worker

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Previous worker run whose browser profile must be restored"
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    # Safety-net restart; the active worker normally renews itself 15 minutes before expiry.
    - cron: "17 */6 * * *"

# Self-renewal handoffs carry an explicit source run ID so the active profile
# is archived/restored safely. A serialized preflight skips delayed schedule,
# push, or manual starts that would otherwise replace an active worker with a
# stale last-successful profile snapshot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  # Serialize only the preflight checks. This closes the race where a delayed
  # scheduled run starts beside a live worker and restores an older successful
  # profile snapshot over the active Chromium profile.
  guard:
    runs-on: ubuntu-latest
    concurrency:
      group: browser-worker-guard-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      should_start: ${{ steps.check.outputs.should_start }}
    steps:
      - name: Skip if an interactive worker is already running
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Self-renewal handoffs explicitly name their source run and must be
          # allowed to overlap it while waiting for its profile artifact.
          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Explicit profile handoff from run $SOURCE_RUN_ID"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active_run_id="$(gh run list --repo "$REPO" --workflow browser-worker.yml --status in_progress --limit 50 --json databaseId --jq ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId" | head -n 1 || true)"
          if [ -n "$active_run_id" ]; then
            echo "::notice::Skipping $EVENT_NAME start: Browser Worker run $active_run_id is already active. Let it retain the current Chromium profile."
            echo "should_start=false" >> "$GITHUB_OUTPUT"
          else
            echo "No other Browser Worker run is active"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
          fi

  browser:
    needs: guard
    if: needs.guard.outputs.should_start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout worker configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up interactive desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc openbox xdotool

      - name: Restore previous browser profile
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p browser-worker-state "$RUNNER_TEMP/browser-worker-profile"

          restore_run() {
            local run_id="$1"
            local artifact_dir="browser-worker-state/profile-artifact"
            local archive="$artifact_dir/browser-worker-profile.tar.gz"
            local extracted="$RUNNER_TEMP/browser-worker-profile-restore"
            echo "Restoring browser profile from workflow run $run_id"
            rm -rf "$artifact_dir" "$extracted"
            if ! gh run download "$run_id" -n browser-worker-profile -D "$artifact_dir" 2>/dev/null; then
              return 1
            fi
            if [ ! -f "$archive" ]; then
              echo "::warning::Run $run_id profile artifact did not contain the expected archive"
              return 1
            fi
            if ! tar -tzf "$archive" | grep -Fx "browser-worker-profile/Local State" > /dev/null ||
               ! tar -tzf "$archive" | grep -Fx "browser-worker-profile/Default/Preferences" > /dev/null; then
              echo "::warning::Run $run_id profile archive is missing Chromium profile metadata"
              return 1
            fi
            mkdir -p "$extracted"
            if ! tar -xzf "$archive" -C "$extracted"; then
              echo "::warning::Run $run_id profile archive could not be extracted"
              rm -rf "$extracted"
              return 1
            fi
            if [ ! -s "$extracted/browser-worker-profile/Local State" ] ||
               [ ! -s "$extracted/browser-worker-profile/Default/Preferences" ]; then
              echo "::warning::Run $run_id profile archive extracted without required Chromium metadata"
              rm -rf "$extracted"
              return 1
            fi

            # Compatibility for archives written by the older workflow, which
            # deleted CacheStorage while archiving. A profile recovery handoff
            # may stage that directory as a sibling to survive the old cleanup.
            local cache_backup="$extracted/browser-worker-profile/Default/Service Worker/CacheStorage.preserved"
            local cache_target="$extracted/browser-worker-profile/Default/Service Worker/CacheStorage"
            if [ -d "$cache_backup" ]; then
              rm -rf "$cache_target"
              mv "$cache_backup" "$cache_target"
              echo "Restored preserved Service Worker CacheStorage from legacy profile archive"
            fi

            rm -rf "$RUNNER_TEMP/browser-worker-profile"
            mv "$extracted/browser-worker-profile" "$RUNNER_TEMP/browser-worker-profile"
            rm -rf "$extracted"
            echo "Restored full Chromium profile from workflow run $run_id"
            return 0
          }

          restore_state() {
            local run_id="$1"
            gh run download "$run_id" -n browser-worker-state -D browser-worker-state 2>/dev/null || true
            if [ -f browser-worker-state/storage-state.json ]; then
              echo "Restored Playwright storage state from workflow run $run_id"
            fi
          }

          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Waiting for browser artifacts from source workflow run $SOURCE_RUN_ID"
            restored=false
            for attempt in $(seq 1 80); do
              if restore_run "$SOURCE_RUN_ID"; then
                restore_state "$SOURCE_RUN_ID"
                restored=true
                break
              fi
              echo "Source browser profile artifact not available yet (attempt $attempt/80); waiting 15s"
              rm -rf "$RUNNER_TEMP/browser-worker-profile"
              mkdir -p "$RUNNER_TEMP/browser-worker-profile"
              rm -rf browser-worker-state/profile-artifact
              sleep 15
            done
            if [ "$restored" != "true" ]; then
              echo "::error::Timed out waiting for browser profile artifact from source workflow run $SOURCE_RUN_ID"
              exit 1
            fi
          else
            previous_run_ids="$(gh run list --workflow browser-worker.yml --status success --limit 20 --json databaseId --jq '.[].databaseId')"
            if [ -n "$previous_run_ids" ]; then
              restored=false
              while IFS= read -r previous_run_id; do
                [ -n "$previous_run_id" ] || continue
                if restore_run "$previous_run_id"; then
                  restore_state "$previous_run_id"
                  restored=true
                  break
                fi
              done <<< "$previous_run_ids"
              if [ "$restored" != "true" ]; then
                echo "::error::Previous successful runs exist, but none contains a valid Chromium profile archive. Refusing to start a fresh profile and overwrite browser state."
                exit 1
              fi
            else
              echo "No previous successful worker run exists; starting the first Chromium profile"
            fi
          fi

      - name: Install upstream Playwright MCP
        run: npm install --no-save @playwright/mcp@0.0.83 ws@^8.18.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium executable
        run: |
          chromium_bin="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$chromium_bin"
          echo "CHROMIUM_BIN=$chromium_bin" >> "$GITHUB_ENV"
          echo "Using shared interactive Chromium at $chromium_bin"

      - name: Stop older worker runs after a push deployment
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          for run_id in $(gh run list --workflow browser-worker.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              echo "Cancelling stale Browser Worker run $run_id"
              gh run cancel "$run_id" || true
            fi
          done

      - name: Run browser worker and interactive desktop
        env:
          UTILS_BROWSER_WORKER_URL: ${{ secrets.UTILS_BROWSER_WORKER_URL }}
          UTILS_BROWSER_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
          BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON: ${{ secrets.BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON }}
          BROWSER_WORKER_STATE_FILE: browser-worker-state/storage-state.json
          PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp
          PLAYWRIGHT_MCP_USER_DATA_DIR: ${{ runner.temp }}/browser-worker-profile
          PLAYWRIGHT_MCP_CDP_ENDPOINT: http://127.0.0.1:9222
          PLAYWRIGHT_MCP_CDP_TIMEOUT: "120000"
          WORKER_MAX_SECONDS: "19800"
          WORKER_RENEWAL_LEAD_SECONDS: "900"
          GITHUB_TOKEN: ${{ github.token }}
          VM_WORKER_ID: github-${{ github.run_id }}
          VM_CHROMIUM_DEBUG_PORT: "9222"
          DISPLAY: ":99"
          NODE_OPTIONS: "--import=./src/vm-heartbeat-hook.mjs"
        run: |
          test -n "$UTILS_BROWSER_WORKER_URL" || (echo "::error::Set UTILS_BROWSER_WORKER_URL in repository secrets" && exit 1)
          test -n "$UTILS_BROWSER_WORKER_TOKEN" || (echo "::error::Set UTILS_BROWSER_WORKER_TOKEN in repository secrets" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "::error::GitHub Actions token is unavailable" && exit 1)
          test -n "$CHROMIUM_BIN" || (echo "::error::Chromium executable was not found" && exit 1)

          bash src/vm-supervisor.sh > "$RUNNER_TEMP/interactive-vm.log" 2>&1 &
          vm_pid=$!
          trap 'kill "$vm_pid" 2>/dev/null || true; wait "$vm_pid" 2>/dev/null || true' EXIT

          # Render may be restarting or deploying while the runner is already
          # starting. Keep the runner alive long enough for the supervisor to
          # reconnect instead of failing the workflow after 60 seconds.
          for attempt in $(seq 1 300); do
            if grep -q "Interactive VM connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
              echo "Interactive VM relay is connected"
              break
            fi
            if ! kill -0 "$vm_pid" 2>/dev/null; then
              echo "::error::Interactive VM supervisor exited during startup"
              cat "$RUNNER_TEMP/interactive-vm.log"
              exit 1
            fi
            sleep 1
          done

          if ! grep -q "Interactive VM connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
            echo "::error::Interactive VM relay did not connect to utils within 5 minutes"
            cat "$RUNNER_TEMP/interactive-vm.log"
            exit 1
          fi

          node src/worker.js

      - name: Prepare browser profile artifact
        if: ${{ always() }}
        run: |
          profile_dir="$RUNNER_TEMP/browser-worker-profile"
          if [ ! -d "$profile_dir" ]; then
            echo "::error::Chromium profile directory is missing; refusing to publish an empty profile artifact"
            exit 1
          fi
          if [ ! -s "$profile_dir/Local State" ] || [ ! -s "$profile_dir/Default/Preferences" ]; then
            echo "::error::Chromium did not populate the configured profile directory ($profile_dir). Check the --user-data-dir argument; refusing to publish a blank snapshot."
            find "$profile_dir" -maxdepth 2 -type f -printf '%P (%s bytes)\n' | head -n 50
            exit 1
          fi

          # Remove process-specific locks and disposable caches only. Keep
          # cookies, History, Local Storage, IndexedDB, and Service Worker data.
          find "$profile_dir" -maxdepth 1 -type f \( -name 'SingletonLock' -o -name 'SingletonCookie' -o -name 'SingletonSocket' -o -name 'DevToolsActivePort' \) -delete
          rm -rf \
            "$profile_dir/Default/Cache" \
            "$profile_dir/Default/Code Cache" \
            "$profile_dir/Default/GPUCache" \
            "$profile_dir/Default/GrShaderCache" \
            "$profile_dir/Default/ShaderCache" \
            "$profile_dir/Crashpad" \
            "$profile_dir/Crash Reports" \
            "$profile_dir/BrowserMetrics" \
            "$profile_dir/GraphiteDawnCache" \
            "$profile_dir/GrShaderCache"

          tar -czf browser-worker-profile.tar.gz -C "$RUNNER_TEMP" browser-worker-profile
          tar -tzf browser-worker-profile.tar.gz | grep -Fx "browser-worker-profile/Local State" > /dev/null
          tar -tzf browser-worker-profile.tar.gz | grep -Fx "browser-worker-profile/Default/Preferences" > /dev/null
          ls -lh browser-worker-profile.tar.gz

      - name: Upload browser profile
        if: ${{ always() && hashFiles('browser-worker-profile.tar.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-profile
          path: browser-worker-profile.tar.gz
          retention-days: 90
          overwrite: true

      - name: Upload browser storage state
        if: ${{ always() && hashFiles('browser-worker-state/storage-state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-state
          path: browser-worker-state/storage-state.json
          retention-days: 90
          overwrite: true
