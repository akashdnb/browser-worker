name: Browser Worker

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Previous worker run whose browser state artifact must be restored"
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    # Safety-net restart; the active worker normally renews itself 15 minutes before expiry.
    - cron: "17 */6 * * *"

# Pushes are deployments of the worker code and should supersede older push
# runs. Self-renewal/manual runs use unique groups so the handoff can overlap
# the current worker long enough to restore its state artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout worker configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up interactive desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc openbox

      - name: Restore previous browser storage state
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p browser-worker-state
          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Waiting for browser state artifact from source workflow run $SOURCE_RUN_ID"
            restored=false
            for attempt in $(seq 1 80); do
              if gh run download "$SOURCE_RUN_ID" -n browser-worker-state -D browser-worker-state 2>/dev/null; then
                if [ -f browser-worker-state/storage-state.json ]; then
                  restored=true
                  echo "Restored browser state from source workflow run $SOURCE_RUN_ID"
                  break
                fi
              fi
              echo "Source state artifact not available yet (attempt $attempt/80); waiting 15s"
              rm -f browser-worker-state/storage-state.json
              sleep 15
            done
            if [ "$restored" != "true" ]; then
              echo "::error::Timed out waiting for browser state artifact from source workflow run $SOURCE_RUN_ID"
              exit 1
            fi
          else
            latest_run_id="$(gh run list --workflow browser-worker.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "$latest_run_id" ]; then
              echo "Restoring browser state from workflow run $latest_run_id"
              if gh run download "$latest_run_id" -n browser-worker-state -D browser-worker-state; then
                test -f browser-worker-state/storage-state.json || rm -f browser-worker-state/storage-state.json
              else
                echo "No previous browser state artifact found; starting fresh"
              fi
            else
              echo "No previous successful worker run found; starting fresh"
            fi
          fi

      - name: Install upstream Playwright MCP
        run: npm install --no-save @playwright/mcp@0.0.83 ws@^8.18.0

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium executable
        run: |
          chromium_bin="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$chromium_bin"
          echo "CHROMIUM_BIN=$chromium_bin" >> "$GITHUB_ENV"
          echo "Using interactive Chromium at $chromium_bin"

      - name: Run browser worker and interactive desktop
        env:
          UTILS_BROWSER_WORKER_URL: ${{ secrets.UTILS_BROWSER_WORKER_URL }}
          UTILS_BROWSER_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
          BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON: ${{ secrets.BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON }}
          BROWSER_WORKER_STATE_FILE: browser-worker-state/storage-state.json
          PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp
          PLAYWRIGHT_MCP_USER_DATA_DIR: ${{ runner.temp }}/browser-worker-profile
          WORKER_MAX_SECONDS: "19800"
          WORKER_RENEWAL_LEAD_SECONDS: "900"
          GITHUB_TOKEN: ${{ github.token }}
          VM_WORKER_ID: github-${{ github.run_id }}
          DISPLAY: ":99"
        run: |
          test -n "$UTILS_BROWSER_WORKER_URL" || (echo "::error::Set UTILS_BROWSER_WORKER_URL in repository secrets" && exit 1)
          test -n "$UTILS_BROWSER_WORKER_TOKEN" || (echo "::error::Set UTILS_BROWSER_WORKER_TOKEN in repository secrets" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "::error::GitHub Actions token is unavailable" && exit 1)
          test -n "$CHROMIUM_BIN" || (echo "::error::Chromium executable was not found" && exit 1)

          node src/vm.js > "$RUNNER_TEMP/interactive-vm.log" 2>&1 &
          vm_pid=$!
          trap 'kill "$vm_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if grep -q "Interactive VM connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
              echo "Interactive VM relay is connected"
              break
            fi
            if ! kill -0 "$vm_pid" 2>/dev/null; then
              echo "::error::Interactive VM relay exited during startup"
              cat "$RUNNER_TEMP/interactive-vm.log"
              exit 1
            fi
            sleep 1
          done

          if ! grep -q "Interactive VM connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
            echo "::error::Interactive VM relay did not connect to utils within 60 seconds"
            cat "$RUNNER_TEMP/interactive-vm.log"
            exit 1
          fi

          node src/worker.js

      - name: Upload browser storage state
        if: ${{ always() && hashFiles('browser-worker-state/storage-state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-state
          path: browser-worker-state/storage-state.json
          retention-days: 90
          overwrite: true
