name: Browser Worker Secondary
run-name: ${{ inputs.vm_id && format('VM {0}', inputs.vm_id) || 'Legacy browser worker' }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Previous worker run whose browser profile must be restored (legacy worker only)"
        required: false
        type: string
      vm_id:
        description: "Stable Utils VM instance ID; leave blank for the legacy shared browser worker"
        required: false
        type: string
      worker_mode:
        description: "compute or browser"
        required: false
        type: choice
        options:
          - compute
          - browser
      size:
        description: "GitHub-hosted runner size (allowlisted in this workflow)"
        required: false
        type: choice
        options:
          - standard
          - large
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.vm_id || 'legacy-browser-session' }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    concurrency:
      group: browser-worker-guard-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      should_start: ${{ steps.check.outputs.should_start }}
    steps:
      - name: Skip if an interactive worker is already running
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '' }}
          VM_ID: ${{ inputs.vm_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$VM_ID" ]; then
            echo "Independent Utils VM worker $VM_ID; skipping legacy singleton guard"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Explicit profile handoff from run $SOURCE_RUN_ID"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          legacy_run_ids() {
            local run_state="$1"
            for candidate in $(gh run list --repo "$REPO" --workflow browser-worker.yml --status "$run_state" --limit 50 --json databaseId --jq ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId"); do
              job_names="$(gh run view "$candidate" --repo "$REPO" --json jobs --jq '.jobs[].name' 2>/dev/null || true)"
              if printf '%s\n' "$job_names" | grep -q '^VM '; then
                continue
              fi
              echo "$candidate"
            done
          }

          if [ "$EVENT_NAME" = "push" ]; then
            for state in in_progress queued; do
              while IFS= read -r stale_run_id; do
                [ -n "$stale_run_id" ] || continue
                echo "::notice::Cancelling legacy Browser Worker run $stale_run_id before push handoff."
                gh run cancel "$stale_run_id" --repo "$REPO" || true
              done < <(legacy_run_ids "$state")
            done
            for attempt in $(seq 1 60); do
              active_run_id="$(legacy_run_ids in_progress | head -n 1 || true)"
              queued_run_id="$(legacy_run_ids queued | head -n 1 || true)"
              if [ -z "$active_run_id" ] && [ -z "$queued_run_id" ]; then break; fi
              sleep 2
            done
          fi

          active_run_id="$(legacy_run_ids in_progress | head -n 1 || true)"
          queued_run_id="$(legacy_run_ids queued | head -n 1 || true)"
          if [ -n "$active_run_id" ] || [ -n "$queued_run_id" ]; then
            echo "::error::Refusing to start while another Browser Worker run is active (active=$active_run_id queued=$queued_run_id)."
            echo "should_start=false" >> "$GITHUB_OUTPUT"
          else
            echo "No other Browser Worker run is active or queued"
            echo "should_start=true" >> "$GITHUB_OUTPUT"
          fi

  browser:
    needs: guard
    if: needs.guard.outputs.should_start == 'true'
    runs-on: ${{ inputs.size == 'large' && vars.VM_LARGE_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 350
    name: ${{ inputs.vm_id && format('VM {0}', inputs.vm_id) || 'Legacy browser worker' }}
    concurrency:
      group: utils-vm-${{ inputs.vm_id || 'legacy-browser-session' }}
      cancel-in-progress: ${{ inputs.vm_id != '' }}
    steps:
      - name: Checkout worker configuration
        uses: actions/checkout@v4
      - name: Prepare VM identity and OIDC bootstrap
        id: bootstrap
        if: ${{ inputs.vm_id }}
        env:
          VM_ID: ${{ inputs.vm_id }}
          BOOTSTRAP_URL: https://utils-l1pw.onrender.com/vm-fleet/bootstrap
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=utils-vm-bootstrap" | jq -er .value)"
          response="$(curl -fsS -X POST "$BOOTSTRAP_URL" -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data "$(jq -nc --arg vm_id "$VM_ID" '{vm_id:$vm_id}')")"
          worker_token="$(jq -er .worker_token <<< "$response")"
          vm_spec="$(jq -ec .spec <<< "$response")"
          worker_mode="$(jq -er .worker_mode <<< "$response")"
          browser_url="$(jq -er .browser_worker_ws_url <<< "$response")"
          vm_url="$(jq -er .vm_worker_ws_url <<< "$response")"
          echo "::add-mask::$worker_token"
          printf '%s' "$vm_spec" > "$RUNNER_TEMP/vm-spec.json"
          {
            echo "VM_ID=$VM_ID"
            echo "VM_SPEC_PATH=$RUNNER_TEMP/vm-spec.json"
            echo "VM_WORKER_TOKEN=$worker_token"
            echo "UTILS_BROWSER_WORKER_TOKEN=$worker_token"
            echo "UTILS_BROWSER_WORKER_URL=$browser_url"
            echo "UTILS_VM_FLEET_URL=$vm_url"
            echo "WORKER_MODE=$worker_mode"
            echo "BROWSER_WORKER_PROFILE_DIR=$RUNNER_TEMP/vm-profile-$VM_ID"
            echo "PLAYWRIGHT_MCP_USER_DATA_DIR=$RUNNER_TEMP/vm-profile-$VM_ID"
            echo "BROWSER_WORKER_CHECKPOINT_DIR=$RUNNER_TEMP/vm-checkpoint-$VM_ID"
            echo "BROWSER_WORKER_STATE_FILE=$RUNNER_TEMP/vm-checkpoint-$VM_ID/storage-state.json"
            echo "BROWSER_WORKER_STATE_RELEASE_TAG=vm-profile-$VM_ID"
            echo "VM_LIFECYCLE_MODE=$(jq -r '.lifecycle.mode // "on_demand"' <<< "$vm_spec")"
            echo "VM_BROWSER_PERSISTENT_PROFILE=$(jq -r '.browser.persistent_profile // true' <<< "$vm_spec")"
            max_lifetime="$(jq -r '.lifecycle.max_lifetime_minutes // 345' <<< "$vm_spec")"
            if [ "$max_lifetime" -gt 345 ]; then echo "::error::GitHub Actions VM maximum lifetime is 345 minutes"; exit 1; fi
            [ "$max_lifetime" -ge 1 ] || { echo "::error::VM maximum lifetime must be at least one minute"; exit 1; }
            echo "VM_MAX_LIFETIME_MINUTES=$max_lifetime" >> "$GITHUB_ENV"
            worker_seconds=$((max_lifetime * 60 - 60))
            [ "$worker_seconds" -ge 60 ] || worker_seconds=60
            [ "$worker_seconds" -le 21000 ] || worker_seconds=21000
            echo "WORKER_MAX_SECONDS=$worker_seconds" >> "$GITHUB_ENV"
            echo "VM_PYTHON_VERSION=$(jq -r '.runtime.python // "3.12"' <<< "$vm_spec")"
            echo "VM_NODE_VERSION=$(jq -r '.runtime.node // "22"' <<< "$vm_spec")"
          } >> "$GITHUB_ENV"
          {
            echo "python_version=$(jq -r '.runtime.python // "3.12"' <<< "$vm_spec")"
            echo "node_version=$(jq -r '.runtime.node // "22"' <<< "$vm_spec")"
            echo "worker_mode=$worker_mode"
          } >> "$GITHUB_OUTPUT"
          # VM startup environment is masked before being exposed to subsequent steps.
          while IFS= read -r entry; do
            key="$(jq -r .key <<< "$entry")"
            value="$(jq -r .value <<< "$entry")"
            echo "::add-mask::$value"
            delimiter="VM_ENV_$(openssl rand -hex 12)"
            {
              printf '%s<<%s\n' "$key" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          done < <(jq -c '.startup.environment // {} | to_entries[]' <<< "$vm_spec")
          # Secret references are resolved by a dedicated secret bridge, not by workflow inputs.
          if [ "$(jq '(.startup.secret_refs // {}) | length' <<< "$vm_spec")" -gt 0 ]; then
            echo "::warning::VM has secret_refs; values are not injected until a supported secret resolver is configured."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.bootstrap.outputs.node_version || '22' }}

      - name: Set up Python
        if: ${{ inputs.vm_id }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.bootstrap.outputs.python_version || '3.12' }}

      - name: Validate requested VM resources
        if: ${{ inputs.vm_id }}
        env:
          VM_SPEC_PATH: ${{ runner.temp }}/vm-spec.json
          WORKER_SIZE: ${{ inputs.size || 'standard' }}
          LARGE_RUNNER_LABEL: ${{ vars.VM_LARGE_RUNNER_LABEL }}
          LARGE_RUNNER_CPU: ${{ vars.VM_LARGE_RUNNER_CPU }}
          LARGE_RUNNER_MEMORY_MB: ${{ vars.VM_LARGE_RUNNER_MEMORY_MB }}
          LARGE_RUNNER_DISK_GB: ${{ vars.VM_LARGE_RUNNER_DISK_GB }}
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const spec = JSON.parse(await fs.readFile(process.env.VM_SPEC_PATH, 'utf8'));
          const cpu = Number(spec.resources?.cpu ?? 2);
          const memory = Number(spec.resources?.memory_mb ?? 4096);
          const disk = Number(spec.resources?.disk_gb ?? 10);
          const gpu = spec.resources?.gpu;
          const size = process.env.WORKER_SIZE;
          const standard = {cpu: 2, memory_mb: 8192, disk_gb: 14};
          const large = {
            cpu: Number(process.env.LARGE_RUNNER_CPU),
            memory_mb: Number(process.env.LARGE_RUNNER_MEMORY_MB),
            disk_gb: Number(process.env.LARGE_RUNNER_DISK_GB),
          };
          if (gpu) throw new Error("GPU is not available on the configured GitHub Actions runner profiles");
          let profile = standard;
          if (size === "large") {
            if (!process.env.LARGE_RUNNER_LABEL || !Number.isFinite(large.cpu) ||
                !Number.isFinite(large.memory_mb) || !Number.isFinite(large.disk_gb)) {
              throw new Error("Configure VM_LARGE_RUNNER_LABEL, VM_LARGE_RUNNER_CPU, VM_LARGE_RUNNER_MEMORY_MB and VM_LARGE_RUNNER_DISK_GB as browser-worker repository variables before requesting a large VM");
            }
            profile = large;
          } else if (size !== "standard") {
            throw new Error("Unsupported GitHub runner size");
          }
          if (cpu > profile.cpu || memory > profile.memory_mb || disk > profile.disk_gb) {
            throw new Error(`Requested resources (${cpu} CPU, ${memory} MB, ${disk} GB) exceed the ${size} GitHub runner profile: ${JSON.stringify(profile)}`);
          }
          NODE

      - name: Install requested runtimes and packages
        env:
          VM_SPEC_PATH: ${{ runner.temp }}/vm-spec.json
          WORKER_MODE: ${{ steps.bootstrap.outputs.worker_mode || 'browser' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl ca-certificates
          VM_SPEC="$(cat "$VM_SPEC_PATH" 2>/dev/null || echo '{}')"
          mapfile -t apt_packages < <(echo "$VM_SPEC" | jq -r '.runtime.packages_apt[]?')
          if [ "${#apt_packages[@]}" -gt 0 ]; then sudo apt-get install -y -- "${apt_packages[@]}"; fi
          mapfile -t pip_packages < <(echo "$VM_SPEC" | jq -r '.runtime.packages_pip[]?')
          if [ "${#pip_packages[@]}" -gt 0 ]; then python -m pip install --user --break-system-packages "${pip_packages[@]}"; fi
          mapfile -t npm_packages < <(echo "$VM_SPEC" | jq -r '.runtime.packages_npm[]?')
          if [ "${#npm_packages[@]}" -gt 0 ]; then npm install --global "${npm_packages[@]}"; fi
          mapfile -t cli_tools < <(echo "$VM_SPEC" | jq -r '.runtime.cli_tools[]?')
          if [ "${#cli_tools[@]}" -gt 0 ]; then sudo apt-get install -y -- "${cli_tools[@]}"; fi
          if [ "$WORKER_MODE" = "browser" ]; then
            npm install --no-save ws@^8.18.0 @playwright/mcp@0.0.83
          else
            npm install --no-save ws@^8.18.0
          fi

      - name: Install Chromium and OS dependencies
        if: ${{ steps.bootstrap.outputs.worker_mode != 'compute' }}
        run: npx playwright install --with-deps chromium

      - name: Run VM setup scripts
        if: ${{ inputs.vm_id }}
        env:
          VM_SPEC_PATH: ${{ runner.temp }}/vm-spec.json
        run: |
          set -euo pipefail
          while IFS= read -r script_json; do
            script="$(jq -r . <<< "$script_json")"
            bash -euo pipefail -c "$script"
          done < <(jq -c '.startup.setup_scripts[]? // empty' "$VM_SPEC_PATH")

      - name: Set up interactive desktop dependencies
        if: ${{ steps.bootstrap.outputs.worker_mode != 'compute' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc openbox xdotool

      - name: Configure legacy worker environment
        if: ${{ !inputs.vm_id }}
        env:
          DEFAULT_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
        run: |
          test -n "$DEFAULT_WORKER_TOKEN" || { echo "::error::Legacy browser worker token is missing"; exit 1; }
          {
            echo "WORKER_MODE=browser"
            echo "UTILS_BROWSER_WORKER_TOKEN=$DEFAULT_WORKER_TOKEN"
            echo "UTILS_BROWSER_WORKER_URL=https://utils-l1pw.onrender.com/browser-worker"
          } >> "$GITHUB_ENV"

      - name: Restore previous browser profile
        if: ${{ inputs.worker_mode != 'compute' && !inputs.vm_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          UTILS_BROWSER_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
          BROWSER_WORKER_PROFILE_ENCRYPTION_KEY: ${{ secrets.BROWSER_WORKER_PROFILE_ENCRYPTION_KEY }}
        run: |
          export BROWSER_WORKER_PROFILE_DIR="$GITHUB_WORKSPACE/browser-worker-state/live-profile"
          mkdir -p browser-worker-state "$BROWSER_WORKER_PROFILE_DIR"
          echo "BROWSER_WORKER_PROFILE_DIR=$BROWSER_WORKER_PROFILE_DIR" >> "$GITHUB_ENV"

          restore_archive() {
            local archive="$1"
            local decrypted=""
            local extracted="$GITHUB_WORKSPACE/browser-worker-state/profile-restore"
            if [[ "$archive" == *.enc ]]; then
              decrypted="$GITHUB_WORKSPACE/browser-worker-state/profile-restore-archive.tar.gz"
              rm -f "$decrypted"
              if ! node src/profile-archive-crypto.mjs decrypt "$archive" "$decrypted"; then
                echo "::warning::Could not decrypt profile archive"
                return 1
              fi
              archive="$decrypted"
            fi
            rm -rf "$extracted"
            if [ ! -s "$archive" ] ||
               ! tar -tzf "$archive" | grep -Fx "browser-worker-profile/Local State" > /dev/null ||
               ! tar -tzf "$archive" | grep -Fx "browser-worker-profile/Default/Preferences" > /dev/null; then
              echo "::warning::Profile archive is missing Chromium metadata"
              [ -n "$decrypted" ] && rm -f "$decrypted"
              return 1
            fi
            mkdir -p "$extracted"
            if ! tar -xzf "$archive" -C "$extracted"; then
              rm -rf "$extracted"
              [ -n "$decrypted" ] && rm -f "$decrypted"
              return 1
            fi
            if [ ! -s "$extracted/browser-worker-profile/Local State" ] ||
               [ ! -s "$extracted/browser-worker-profile/Default/Preferences" ]; then
              rm -rf "$extracted"
              [ -n "$decrypted" ] && rm -f "$decrypted"
              return 1
            fi
            local cache_backup="$extracted/browser-worker-profile/Default/Service Worker/CacheStorage.preserved"
            local cache_target="$extracted/browser-worker-profile/Default/Service Worker/CacheStorage"
            if [ -d "$cache_backup" ]; then rm -rf "$cache_target"; mv "$cache_backup" "$cache_target"; fi
            rm -rf "$BROWSER_WORKER_PROFILE_DIR"
            mv "$extracted/browser-worker-profile" "$BROWSER_WORKER_PROFILE_DIR"
            rm -rf "$extracted"
            [ -n "$decrypted" ] && rm -f "$decrypted"
            echo "Restored Chromium profile"
            return 0
          }

          restore_run() {
            local run_id="$1"
            local artifact_dir="browser-worker-state/profile-artifact"
            rm -rf "$artifact_dir"
            if ! gh run download "$run_id" -n browser-worker-profile -D "$artifact_dir" 2>/dev/null; then return 1; fi
            local profile_archive="$artifact_dir/browser-worker-profile.tar.gz.enc"
            if [ ! -s "$profile_archive" ]; then profile_archive="$artifact_dir/browser-worker-profile.tar.gz"; fi
            restore_archive "$profile_archive" || return 1
            if gh run download "$run_id" -n browser-worker-state -D browser-worker-state 2>/dev/null; then
              if [ -s "browser-worker-state/storage-state.json.enc" ]; then
                node src/profile-archive-crypto.mjs decrypt \
                  "browser-worker-state/storage-state.json.enc" "browser-worker-state/storage-state.json" || return 1
              fi
            fi
            return 0
          }

          restored=false
          if [ -n "$SOURCE_RUN_ID" ]; then
            source_status="$(gh run view "$SOURCE_RUN_ID" --json status --jq '.status' 2>/dev/null || true)"
            echo "Profile handoff source run $SOURCE_RUN_ID is $source_status"
            if [ "$source_status" = "in_progress" ] || [ "$source_status" = "queued" ]; then
              echo "Waiting briefly for the source run to publish its final profile"
              for attempt in $(seq 1 20); do
                if restore_run "$SOURCE_RUN_ID"; then restored=true; break; fi
                source_status="$(gh run view "$SOURCE_RUN_ID" --json status --jq '.status' 2>/dev/null || true)"
                if [ "$source_status" != "in_progress" ] && [ "$source_status" != "queued" ]; then
                  echo "Source run became $source_status; switching to checkpoint recovery"
                  break
                fi
                echo "Source profile artifact not available yet (attempt $attempt/20); waiting 15s"
                sleep 15
              done
            elif [ "$source_status" = "completed" ]; then
              restore_run "$SOURCE_RUN_ID" && restored=true || true
            else
              echo "::warning::Could not confirm source run state; attempting its final profile once"
              restore_run "$SOURCE_RUN_ID" && restored=true || true
            fi
          else
            # A cancelled worker may still publish its final profile from an always() step.
            # Check every completed run, not only successful runs, before release fallback.
            previous_run_ids="$(gh run list --workflow browser-worker.yml --status completed --limit 50 --json databaseId --jq '.[].databaseId')"
            while IFS= read -r previous_run_id; do
              [ -n "$previous_run_id" ] || continue
              if restore_run "$previous_run_id"; then restored=true; break; fi
            done <<< "$previous_run_ids"
          fi

          if [ "$restored" != "true" ]; then
            # The private draft release is updated while the worker is running,
            # so abrupt job cancellation does not discard the latest profile.
            release_dir="browser-worker-state/release-artifact"
            profile_assets="$(gh release view browser-worker-state --json assets --jq '.assets[].name' 2>/dev/null | grep -E '^browser-worker-profile-[0-9]+[.]tar[.]gz[.]enc' | sort -r || true)"
            while IFS= read -r profile_asset; do
              [ -n "$profile_asset" ] || continue
              rm -rf "$release_dir"
              mkdir -p "$release_dir"
              if gh release download browser-worker-state --pattern "$profile_asset" --dir "$release_dir" 2>/dev/null &&
                 restore_archive "$release_dir/$profile_asset"; then
                restored=true
                break
              fi
            done <<< "$profile_assets"
            if [ "$restored" = "true" ]; then
              storage_asset="$(gh release view browser-worker-state --json assets --jq '.assets[].name' 2>/dev/null | grep -E '^storage-state-[0-9]+[.]json[.]enc' | sort -r | head -n 1 || true)"
              if [ -n "$storage_asset" ] &&
                 gh release download browser-worker-state --pattern "$storage_asset" --dir "$release_dir" 2>/dev/null &&
                 [ -s "$release_dir/$storage_asset" ]; then
                node src/profile-archive-crypto.mjs decrypt \
                  "$release_dir/$storage_asset" "browser-worker-state/storage-state.json" || true
              fi
              echo "Restored latest encrypted profile checkpoint from the private draft release"
            fi
          fi

          if [ "$restored" != "true" ]; then
            # Cancelled/killed runs may never publish their final profile.
            # Recover the latest valid periodic checkpoint instead of failing
            # startup or launching an empty Chromium profile.
            echo "Looking for the latest available periodic profile checkpoint"
            checkpoint_runs="$(gh run list --workflow browser-worker.yml --status completed --limit 50 --json databaseId --jq '.[].databaseId')"
            while IFS= read -r previous_run_id; do
              [ -n "$previous_run_id" ] || continue
              checkpoint_dir="browser-worker-state/checkpoint-artifact"
              artifact_names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run_id/artifacts" --paginate --jq '.artifacts | sort_by(.created_at) | reverse | .[].name' 2>/dev/null || true)"
              while IFS= read -r artifact_name; do
                case "$artifact_name" in
                  browser-worker-profile-checkpoint*)
                    rm -rf "$checkpoint_dir"
                    if gh run download "$previous_run_id" -n "$artifact_name" -D "$checkpoint_dir" 2>/dev/null &&
                       restore_archive "$checkpoint_dir/browser-worker-profile.tar.gz"; then
                      restored=true
                      echo "Restored periodic profile checkpoint $artifact_name from run $previous_run_id"
                      break
                    fi
                    ;;
                esac
              done <<< "$artifact_names"
              if [ "$restored" = "true" ]; then break; fi
            done <<< "$checkpoint_runs"
          fi

          if [ "$restored" != "true" ]; then
            if ! gh release view browser-worker-state >/dev/null 2>&1; then
              echo "::warning::No saved browser profile exists yet; starting a fresh profile."
              mkdir -p "$BROWSER_WORKER_PROFILE_DIR"
              restored=true
            else
              echo "::error::A recovery store exists but no valid profile could be restored; refusing to start blank."
              exit 1
            fi
          fi

      - name: Remove legacy unencrypted profile artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(gh api --paginate --jq '.artifacts[] | select(.name == "browser-worker-profile" or .name == "browser-worker-state" or .name == "browser-worker-profile-checkpoint" or (.name | startswith("browser-worker-profile-checkpoint-"))) | .id' "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" 2>/dev/null || true)"
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done <<< "$artifact_ids"

      - name: Restore per-VM browser profile
        if: ${{ inputs.vm_id && steps.bootstrap.outputs.worker_mode == 'browser' && env.VM_LIFECYCLE_MODE == 'persistent' && env.VM_BROWSER_PERSISTENT_PROFILE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VM_ID: ${{ inputs.vm_id }}
          VM_LIFECYCLE_MODE: ${{ env.VM_LIFECYCLE_MODE }}
          PROFILE_DIR: ${{ runner.temp }}/vm-profile-${{ inputs.vm_id }}
          PROFILE_RELEASE: vm-profile-${{ inputs.vm_id }}
          BROWSER_WORKER_PROFILE_ENCRYPTION_KEY: ${{ secrets.BROWSER_WORKER_PROFILE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$PROFILE_DIR"
          if [ "$VM_LIFECYCLE_MODE" != "persistent" ]; then
            echo "Profile persistence is disabled for $VM_LIFECYCLE_MODE VM."
            exit 0
          fi
          if [ -z "$BROWSER_WORKER_PROFILE_ENCRYPTION_KEY" ]; then
            echo "::error::Set BROWSER_WORKER_PROFILE_ENCRYPTION_KEY in browser-worker repository secrets to persist per-VM browser profiles."
            exit 1
          fi
          if gh release view "$PROFILE_RELEASE" >/dev/null 2>&1; then
            asset="$(gh release view "$PROFILE_RELEASE" --json assets --jq '.assets[].name | select(startswith("browser-worker-profile-") and endswith(".tar.gz.enc"))' | sort -r | head -n 1)"
            if [ -z "$asset" ]; then
              echo "::error::Persistent profile release exists but contains no encrypted profile archive."
              exit 1
            fi
            restore_dir="$RUNNER_TEMP/profile-restore-$VM_ID"
            mkdir -p "$restore_dir"
            gh release download "$PROFILE_RELEASE" --pattern "$asset" --dir "$restore_dir"
            node src/profile-archive-crypto.mjs decrypt "$restore_dir/$asset" "$restore_dir/profile.tar.gz"
            tar -tzf "$restore_dir/profile.tar.gz" | grep -Fx "browser-worker-profile/Local State" >/dev/null
            tar -tzf "$restore_dir/profile.tar.gz" | grep -Fx "browser-worker-profile/Default/Preferences" >/dev/null
            rm -rf "$PROFILE_DIR"
            mkdir -p "$restore_dir/extracted"
            tar -xzf "$restore_dir/profile.tar.gz" -C "$restore_dir/extracted"
            mv "$restore_dir/extracted/browser-worker-profile" "$PROFILE_DIR"
            echo "Restored encrypted profile for VM $VM_ID"
          else
            echo "No prior profile exists for VM $VM_ID; starting a fresh persistent profile."
          fi

      - name: Resolve Chromium executable
        if: ${{ inputs.worker_mode != 'compute' }}
        run: |
          chromium_bin="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$chromium_bin"
          echo "CHROMIUM_BIN=$chromium_bin" >> "$GITHUB_ENV"
          echo "Using shared interactive Chromium at $chromium_bin"

      - name: Stop older worker runs after a push deployment
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          for run_id in $(gh run list --workflow browser-worker.yml --status in_progress --limit 50 --json databaseId --jq '.[].databaseId'); do
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then continue; fi
            job_names="$(gh run view "$run_id" --json jobs --jq '.jobs[].name' 2>/dev/null || true)"
            if printf '%s\n' "$job_names" | grep -q '^VM '; then
              echo "::notice::Leaving fleet VM run $run_id active during legacy worker deployment."
              continue
            fi
            gh run cancel "$run_id" || true
          done

      - name: Run browser worker and interactive desktop
        env:
          VM_WORKER_ID: ${{ inputs.vm_id || format('github-{0}', github.run_id) }}
          VM_ID: ${{ inputs.vm_id || '' }}
          VM_SPEC_PATH: ${{ runner.temp }}/vm-spec.json
          WORKER_MODE: ${{ steps.bootstrap.outputs.worker_mode || 'browser' }}
          WORKER_SIZE: ${{ inputs.size || 'standard' }}
          PLAYWRIGHT_MCP_USER_DATA_DIR: ${{ inputs.vm_id && format('{0}/vm-profile-{1}', runner.temp, inputs.vm_id) || format('{0}/browser-worker-state/live-profile', github.workspace) }}
          BROWSER_WORKER_PROFILE_DIR: ${{ inputs.vm_id && format('{0}/vm-profile-{1}', runner.temp, inputs.vm_id) || format('{0}/browser-worker-state/live-profile', github.workspace) }}
          BROWSER_WORKER_CHECKPOINT_DIR: ${{ inputs.vm_id && format('{0}/vm-checkpoint-{1}', runner.temp, inputs.vm_id) || format('{0}/browser-worker-state/live-checkpoint', github.workspace) }}
          BROWSER_WORKER_STATE_FILE: ${{ inputs.vm_id && format('{0}/vm-checkpoint-{1}/storage-state.json', runner.temp, inputs.vm_id) || 'browser-worker-state/storage-state.json' }}
          BROWSER_WORKER_PROFILE_ENCRYPTION_KEY: ${{ secrets.BROWSER_WORKER_PROFILE_ENCRYPTION_KEY }}
          BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON: ${{ secrets.BROWSER_WORKER_INITIAL_STORAGE_STATE_JSON }}
          PLAYWRIGHT_MCP_URL: http://localhost:8931/mcp
          BROWSER_WORKER_CHECKPOINT_SECONDS: "60"
          BROWSER_WORKER_CHECKPOINT_UPLOAD_SECONDS: "900"
          PLAYWRIGHT_MCP_CDP_ENDPOINT: http://127.0.0.1:9222
          PLAYWRIGHT_MCP_CDP_TIMEOUT: "120000"
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          VM_CHROMIUM_DEBUG_PORT: "9222"
          DISPLAY: ":99"
        run: |
          test -n "$UTILS_BROWSER_WORKER_URL" || (echo "::error::Utils browser worker URL is missing" && exit 1)
          test -n "$UTILS_BROWSER_WORKER_TOKEN" || (echo "::error::Utils per-instance worker token is missing" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "::error::GitHub Actions token is unavailable" && exit 1)
          if [ "$WORKER_MODE" = "browser" ]; then
            test -n "$CHROMIUM_BIN" || (echo "::error::Chromium executable was not found" && exit 1)
          fi
          echo "Connecting interactive VM to ${UTILS_BROWSER_WORKER_URL%/browser-worker}"

          if [ "$WORKER_MODE" = "browser" ]; then
            bash src/vm-supervisor.sh > >(tee -a "$RUNNER_TEMP/interactive-vm.log") 2>&1 &
            vm_pid=$!
            if { [ "$VM_LIFECYCLE_MODE" = "persistent" ] && [ "$VM_BROWSER_PERSISTENT_PROFILE" = "true" ]; } || [ -z "$VM_ID" ]; then
              node src/profile-checkpoint-runner.mjs &
              checkpoint_pid=$!
            else
              checkpoint_pid=""
            fi
            trap 'kill "$vm_pid" ${checkpoint_pid:-} 2>/dev/null || true; wait "$vm_pid" ${checkpoint_pid:-} 2>/dev/null || true' EXIT
          else
            vm_pid=""
            checkpoint_pid=""
            trap 'true' EXIT
          fi

          if [ "$WORKER_MODE" = "browser" ]; then
            for attempt in $(seq 1 300); do
              if grep -q "Interactive VM authenticated and connected to utils" "$RUNNER_TEMP/interactive-vm.log"; then
                echo "Interactive VM relay is connected"
                break
              fi
              if ! kill -0 "$vm_pid" 2>/dev/null; then
                echo "::error::Interactive VM supervisor exited during startup"
                cat "$RUNNER_TEMP/interactive-vm.log"
                exit 1
              fi
              sleep 1
            done
            grep -q "Interactive VM authenticated and connected to utils" "$RUNNER_TEMP/interactive-vm.log"
          else
            echo "Worker running in compute-only mode: no browser packages or desktop are started."
          fi
          if [ "$WORKER_MODE" = "browser" ]; then
            node src/worker.js
          else
            node src/vm.js
          fi

      - name: Prepare and encrypt browser profile artifacts
        if: ${{ always() && steps.bootstrap.outputs.worker_mode == 'browser' && !inputs.vm_id }}
        env:
          UTILS_BROWSER_WORKER_TOKEN: ${{ secrets.UTILS_BROWSER_WORKER_TOKEN }}
          BROWSER_WORKER_PROFILE_ENCRYPTION_KEY: ${{ secrets.BROWSER_WORKER_PROFILE_ENCRYPTION_KEY }}
        run: |
          profile_dir="$BROWSER_WORKER_PROFILE_DIR"
          profile_ready=true
          if [ ! -d "$profile_dir" ] || [ ! -s "$profile_dir/Local State" ] || [ ! -s "$profile_dir/Default/Preferences" ]; then
            echo "::error::Chromium profile is missing or empty; refusing to publish a blank snapshot"
            profile_ready=false
          else
            node --input-type=module -e '
              import { createProfileCheckpoint } from "./src/profile-checkpoint.mjs";
              await createProfileCheckpoint({ profileDir: process.env.BROWSER_WORKER_PROFILE_DIR, outputDir: process.cwd() });
            '
            node src/profile-archive-crypto.mjs encrypt browser-worker-profile.tar.gz browser-worker-profile.tar.gz.enc
            rm -f browser-worker-profile.tar.gz
            ls -lh browser-worker-profile.tar.gz.enc
          fi

          checkpoint_archive="browser-worker-state/live-checkpoint/browser-worker-profile.tar.gz"
          if [ -s "$checkpoint_archive" ]; then
            node src/profile-archive-crypto.mjs encrypt "$checkpoint_archive" "$checkpoint_archive.enc"
          fi

          storage_state="browser-worker-state/storage-state.json"
          if [ -s "$storage_state" ]; then
            node src/profile-archive-crypto.mjs encrypt "$storage_state" "$storage_state.enc"
            rm -f "$storage_state"
          fi

          if [ "$profile_ready" != "true" ]; then exit 1; fi

      - name: Upload browser profile
        if: ${{ always() && !inputs.vm_id && hashFiles('browser-worker-profile.tar.gz.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-profile
          path: browser-worker-profile.tar.gz.enc
          retention-days: 90
          overwrite: true

      - name: Upload latest encrypted checkpoint archive
        if: ${{ always() && !inputs.vm_id && hashFiles('browser-worker-state/live-checkpoint/browser-worker-profile.tar.gz.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-profile-checkpoint
          path: browser-worker-state/live-checkpoint/browser-worker-profile.tar.gz.enc
          retention-days: 90
          overwrite: true

      - name: Upload encrypted browser storage state
        if: ${{ always() && !inputs.vm_id && hashFiles('browser-worker-state/storage-state.json.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-state
          path: browser-worker-state/storage-state.json.enc
          retention-days: 90
          overwrite: true
