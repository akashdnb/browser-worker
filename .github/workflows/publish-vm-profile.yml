name: Publish VM Browser Profiles

on:
  workflow_run:
    workflows: ["Browser Worker Secondary"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-profile:
    if: ${{ github.event.workflow_run.head_branch == 'main' && startsWith(github.event.workflow_run.display_title, 'VM vm-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download encrypted profile artifact from completed VM run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish encrypted profile to the per-VM release
        if: ${{ steps.download.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          vm_id="${RUN_TITLE#VM }"
          [[ "$vm_id" =~ ^vm-[A-Za-z0-9._-]{1,60}$ ]] || { echo "::error::Unexpected VM run title"; exit 1; }
          archive="$(find artifacts -type f -name 'browser-worker-profile.tar.gz.enc' -print -quit 2>/dev/null || true)"
          if [ -z "$archive" ]; then
            echo "No browser profile artifact was produced by this VM run."
            exit 0
          fi
          release_tag="vm-profile-$vm_id"
          asset_name="browser-worker-profile-$RUN_ID-$RUN_ATTEMPT.tar.gz.enc"
          cp "$archive" "$RUNNER_TEMP/$asset_name"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --draft --title "Encrypted browser profile $vm_id" --notes "Automatically managed encrypted profile checkpoint for Utils VM $vm_id."
          fi
          gh release upload "$release_tag" "$RUNNER_TEMP/$asset_name" --clobber
          mapfile -t old_assets < <(
            gh release view "$release_tag" --json assets --jq '.assets[].name | select(startswith("browser-worker-profile-") and endswith(".tar.gz.enc"))' |
            sort -r | tail -n +4
          )
          for asset in "${old_assets[@]}"; do
            gh release delete-asset "$release_tag" "$asset" --yes
          done
