name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js src/*.mjs test/*.js; do
            node --check "$file"
          done
