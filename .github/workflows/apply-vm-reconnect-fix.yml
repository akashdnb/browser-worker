name: Apply VM reconnect fix

on:
  push:
    branches:
      - fix/interactive-vm-gateway-reconnect

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply patch
        run: git apply vm-reconnect-vm.patch
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vm.js
          git commit -m 'fix(vm): reconnect relay without restarting desktop'
          git push origin HEAD:${GITHUB_REF_NAME}
