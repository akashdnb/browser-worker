name: Restart Browser Worker

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Start a fresh browser worker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run browser-worker.yml --repo "$REPO"
